name: ui
on:
  push:
    branches: [main]
    paths: ["ui/**", ".github/workflows/ui.yml"]
  pull_request:
    paths: ["ui/**", ".github/workflows/ui.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: ui

jobs:
  check:
    name: lint, check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: ui/.nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: install
        run: npm ci

      - name: biome
        run: npx biome ci .

      - name: astro check
        run: npx astro check

      - name: build
        run: npm run build
        # No API_URL is set here, so the content loader uses fixture posts (HGB-18).