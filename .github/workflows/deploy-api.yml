name: deploy-api
on:
  push:
    branches: [main]
    paths: ["api/**", ".github/workflows/deploy-api.yml"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-api
  cancel-in-progress: false

env:
  REGION: us-central1
  IMAGE: us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/api/api

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: 
      name: production
      url: ${{ steps.url.outputs.url }}
    steps:
      - uses: actions/checkout@v6

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: let docker push to Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: build
        run: docker build --platform linux/amd64 -t "$IMAGE:$GITHUB_SHA" ./api

      - name: push
        run: docker push "$IMAGE:$GITHUB_SHA"

      # Schema changes go in before the new code that needs them. The old
      # revision keeps serving if this fails, so migrations must stay
      # backwards compatible with the code already running.
      - name: migrate
        run: |
          gcloud run jobs update migrate \
            --image "$IMAGE:$GITHUB_SHA" \
            --region "$REGION" \
            --quiet
          gcloud run jobs execute migrate --region "$REGION" --wait

      # The weekly backup runs the same binary, so it follows each release.
      - name: backup job image
        run: |
          gcloud run jobs update backup \
            --image "$IMAGE:$GITHUB_SHA" \
            --region "$REGION" \
            --quiet

      - name: deploy
        run: |
          gcloud run deploy api \
            --image "$IMAGE:$GITHUB_SHA" \
            --region "$REGION" \
            --quiet

      - name: service url
        id: url
        run: |
          echo "url=$(gcloud run services describe api --region "$REGION" --format='value(status.url)')/health" >> "$GITHUB_OUTPUT"