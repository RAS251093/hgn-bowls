version: "2"
linters:
  default: standard       
  enable:
    - bodyclose            
    - errorlint            
    - noctx                
    - gosec                
  exclusions:
    presets:
      - std-error-handling # unchecked Close, Write and friends, as golangci-lint v1 allowed
formatters:
  enable:
    - gofmt
    - goimports